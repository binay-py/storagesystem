# XcodeGen spec: `brew install xcodegen && xcodegen` creates SandukBackup.xcodeproj
name: SandukBackup
options:
  bundleIdPrefix: com.sanduk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # set to your brother's Team ID (Xcode → Settings → Accounts), or pick it in Signing & Capabilities
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  SandukBackup:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sanduk.backup.personal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Sanduk Backup
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad multitasking needs every orientation, or App Store upload is rejected
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Sanduk Backup reads your photos and videos to encrypt them and upload them to your own chest.
        UIBackgroundModes: [processing, fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).backup
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
  SandukBackupTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SandukBackup
schemes:
  SandukBackup:
    build:
      targets:
        SandukBackup: all
    test:
      targets: [SandukBackupTests]
