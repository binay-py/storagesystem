name: iOS app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests (no signing)
        run: |
          set -o pipefail
          xcodebuild test \
            -project SandukBackup.xcodeproj \
            -scheme SandukBackup \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*Sendable|Test Case|Executed|BUILD|TEST" || true
          grep -q "TEST SUCCEEDED" build.log

      - name: Build for a real device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SandukBackup.xcodeproj \
            -scheme SandukBackup \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 20

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: ignore
