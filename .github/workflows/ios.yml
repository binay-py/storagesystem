name: iOS app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests (no signing)
        run: |
          set -o pipefail
          xcodebuild test \
            -project SandukBackup.xcodeproj \
            -scheme SandukBackup \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*Sendable|Test Case|Executed|BUILD|TEST" || true
          grep -q "TEST SUCCEEDED" build.log

      - name: Build for a real device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SandukBackup.xcodeproj \
            -scheme SandukBackup \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 20

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: ignore

  # Signs the app with the App Store Connect API key and uploads it to TestFlight.
  # Skips itself (green, nothing uploaded) until all five secrets exist.
  testflight:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    steps:
      - name: Check secrets
        id: check
        working-directory: .
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID BUNDLE_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::TestFlight upload skipped, missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Generate Xcode project
        if: steps.check.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen

      - name: Install API key
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive (signed by Xcode with the API key)
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SandukBackup.xcodeproj \
            -scheme SandukBackup \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SandukBackup.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -n 40

      - name: Upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SandukBackup.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 40
          echo "::notice::Uploaded build ${{ github.run_number }}. Apple processes it in ~10-30 min, then it appears in TestFlight."

      - name: Remove API key
        if: always()
        working-directory: .
        run: rm -rf "$RUNNER_TEMP/keys"
