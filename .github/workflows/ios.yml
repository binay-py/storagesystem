name: iOS app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests (no signing)
        run: |
          set -o pipefail
          xcodebuild test \
            -project SandukBackup.xcodeproj \
            -scheme SandukBackup \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*Sendable|Test Case|Executed|BUILD|TEST" || true
          grep -q "TEST SUCCEEDED" build.log

      - name: Build for a real device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SandukBackup.xcodeproj \
            -scheme SandukBackup \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 20

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: ignore

  # Signs the app with the Ad Hoc certificate + profile and produces an .ipa that
  # installs on the iPhones registered in the profile (e.g. through Diawi).
  # Skips itself until the signing secrets exist.
  adhoc:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    env:
      P12_B64: ${{ secrets.ADHOC_P12_B64 }}
      P12_PASSWORD: ${{ secrets.ADHOC_P12_PASSWORD }}
      PROFILE_B64: ${{ secrets.ADHOC_PROFILE_B64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    steps:
      - name: Check secrets
        id: check
        working-directory: .
        run: |
          missing=""
          for v in P12_B64 P12_PASSWORD PROFILE_B64 APPLE_TEAM_ID BUNDLE_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Ad Hoc build skipped, missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Install certificate and profile
        if: steps.check.outputs.ready == 'true'
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          # newer Xcode looks here
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        if: steps.check.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen

      - name: Archive (Ad Hoc signing)
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive             -project SandukBackup.xcodeproj             -scheme SandukBackup             -destination "generic/platform=iOS"             -archivePath "$RUNNER_TEMP/SandukBackup.xcarchive"             PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Manual             CODE_SIGN_IDENTITY="Apple Distribution"             PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"             OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"             CURRENT_PROJECT_VERSION="${{ github.run_number }}"             | tail -n 40

      - name: Export .ipa
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
            <key>compileBitcode</key><false/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive             -archivePath "$RUNNER_TEMP/SandukBackup.xcarchive"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -exportPath "$RUNNER_TEMP/export"             | tail -n 40
          ls -la "$RUNNER_TEMP/export"
          mv "$RUNNER_TEMP/export/"*.ipa "$RUNNER_TEMP/export/SandukBackup-${{ github.run_number }}.ipa"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: SandukBackup-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Clean up signing
        if: always()
        working-directory: .
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
